# A Linger server in two containers: linger itself and Caddy for automatic TLS.
# Target: a non-expert friend gets this running in under 15 minutes.
#
#   1. Point your domain's DNS at this machine — two records, the domain
#      itself and `cdn.` in front of it. Uploaded files are served from the
#      second one so somebody else's file is never same-origin with the app.
#   2. Set LINGER_DOMAIN below (and both blocks of the Caddyfile) to that
#      domain.
#   3. docker compose up -d
#   4. docker compose logs linger   ← prints the one-time host-setup URL
#
# Backup = ./data/linger.db + ./data/objects/. That's the whole server. (With
# LINGER_STORAGE=s3, the bucket replaces ./data/objects/.)
#
# Updating = `docker compose pull && docker compose up -d`. The image below
# follows `latest`, which moves when a version is tagged; write `:0.2.0`
# instead if you would rather pick your moment. Nothing updates on its own.
# Images are published for x86-64 and ARM64, so a Raspberry Pi works too.

services:
  linger:
    image: ghcr.io/matthewguenther/linger:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      LINGER_DOMAIN: linger.example.com
      LINGER_DATA_DIR: /data
      LINGER_STORAGE: local
      # Files are served from cdn.<LINGER_DOMAIN> unless you say otherwise.
      # Set this only if that name is taken or you want files somewhere else;
      # it has to be a different host from LINGER_DOMAIN, and the Caddyfile
      # block has to match it.
      # LINGER_MEDIA_DOMAIN: files.linger.example.com
      # How much this server will hold in total, and how long a file stands
      # before it is swept. The defaults are 50 GB and a year; a starred file,
      # and a file on a pinned message, never expire. Sizes take a unit
      # (250GB, 500MB, 2TB) or a plain number of bytes; LINGER_FILE_EXPIRY_DAYS
      # takes a number of days, or `off` to keep everything for good.
      # LINGER_POOL_BYTES: 50GB
      # LINGER_FILE_EXPIRY_DAYS: 365
      # Files in an S3 bucket instead of ./data/objects — Cloudflare R2 is the
      # one to pick, because it charges nothing for bytes going out. Set
      # LINGER_STORAGE to s3 and fill these in; the server refuses to start if
      # any of them are missing.
      # LINGER_S3_BUCKET: linger
      # LINGER_S3_ENDPOINT: https://ACCOUNT.r2.cloudflarestorage.com
      # LINGER_S3_REGION: auto
      # LINGER_S3_ACCESS_KEY_ID: ...
      # LINGER_S3_SECRET_ACCESS_KEY: ...

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data: {}
