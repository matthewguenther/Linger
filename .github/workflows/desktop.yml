name: desktop

# Manual trigger on purpose. This repo is private, so Actions minutes are
# metered and non-Linux runners are billed at a multiplier (Windows 2x,
# macOS 10x). Verifying the desktop shell on every push would burn the monthly
# allowance for no benefit — the Linux shell check in ci.yml already catches
# ordinary breakage, and WebKitGTK is the strictest of the three engines.
# Run this before a release, or after touching client/src-tauri.
on:
  workflow_dispatch:
    inputs:
      run_spike:
        description: "Also run the throwaway Win32 activity spike (T-004)"
        type: boolean
        default: false

jobs:
  shell-windows:
    name: shell builds on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: build frontend
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      # Build, not check: linking is where platform-specific breakage shows up.
      - name: build shell
        run: cargo build --manifest-path client/src-tauri/Cargo.toml

  shell-macos:
    name: shell builds on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: build frontend
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: build shell
        run: cargo build --manifest-path client/src-tauri/Cargo.toml

  spike-windows:
    name: Win32 activity spike (throwaway)
    if: inputs.run_spike
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Prints the foreground app once per second. A CI runner may have no
      # interactive desktop, so the spike also resolves its own pid to an exe
      # path — that half of the pipeline is provable anywhere, and the run
      # fails only if it breaks.
      - name: run spike
        run: cargo run --manifest-path spike/win32/Cargo.toml -- 5
