name: release

# Tag-driven, and only tag-driven (T-701). This job builds on Windows and macOS,
# which bill at 2x and 10x on a private repo, so it must never fire on a push or
# a pull request. To ship:
#
#   1. bump the version in client/package.json, client/src-tauri/Cargo.toml and
#      client/src-tauri/tauri.conf.json — all three, `scripts/version-check.sh`
#      says so if you miss one
#   2. commit, then `git tag v0.2.0 && git push origin v0.2.0`
#   3. this builds four bundles and opens a **draft** release with `latest.json`
#   4. read it, then publish it — publishing is what ships the update, and it is
#      a human's click on purpose
#
# The updater endpoint in tauri.conf.json points at this repo's
# releases/latest/download/latest.json, so a draft is invisible to every
# installed copy until you publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    name: the tag and the key agree with the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versions match the tag
        run: scripts/version-check.sh "${{ github.ref_name }}"
      - name: the signing key is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "FAIL: the TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "      Run scripts/updater-key.sh, then add the two secrets it names."
            echo "      Without it the bundles ship unsigned and no installed copy"
            echo "      will accept them."
            exit 1
          fi
          echo "signing key: present"

  bundle:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away three finished builds. The
      # release is a draft either way, so a partial one is reviewable.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # 22.04 rather than latest: a bundle built against a newer glibc will
          # not start on an older distribution, and the reverse is fine.
          - label: Linux
            os: ubuntu-22.04
            rust-target: ""
            args: ""
          - label: Windows
            os: windows-latest
            rust-target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: system webview deps
        if: matrix.os == 'ubuntu-22.04'
        # Tauri's own documented Linux prerequisites, plus what the AppImage and
        # deb bundlers shell out to. Follow the current vendor list when this
        # breaks, not this comment (AGENTS.md, "where you will be wrong").
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend deps
        working-directory: client
        # tauri-action builds, it does not install. The frontend build itself is
        # tauri.conf.json's beforeBuildCommand.
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundler signs every updater artifact with this. tauri.conf.json
          # has createUpdaterArtifacts on, so a build with no key here fails
          # rather than quietly producing something no installed copy accepts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Linger ${{ github.ref_name }}
          releaseBody: |
            Installers for Linux, macOS and Windows are attached.

            Installed copies find this release through `latest.json` once it is
            published — settings, `updates`, `check again`.
          # Draft on purpose: publishing is what ships the update to everyone,
          # and that is a decision, not a side effect of pushing a tag.
          releaseDraft: true
          prerelease: false
          # `latest.json` — the manifest the updater reads. Every matrix job
          # merges its platform into the same file on the same release.
          includeUpdaterJson: true
