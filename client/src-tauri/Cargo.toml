[package]
name = "linger-client"
description = "Linger desktop shell (Tauri 2)"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Matt Guenther"]
repository = "https://github.com/matthewguenther/Linger"

# Deliberately detached from the root cargo workspace: this crate links against
# system webview libraries that server/CI machines don't have. Build via
# `pnpm tauri dev` / `pnpm tauri build` inside client/.
[workspace]

[lib]
name = "linger_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linger-core = { path = "../../crates/linger-core" }
linger-activity = { path = "../../crates/linger-activity" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
